<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Design System Agent — Blueprint Canvas</title>
<style>
  :root{
    --bg:#0e1013;
    --grid:#1b1f26;
    --panel:#14171c;
    --line:#262b33;
    --text:#e8eaed;
    --muted:#8b93a1;
    --accent:#6ea8fe;
    --c-know:#7c6cf0;
    --c-plan:#3fa9f5;
    --c-make:#31c48d;
    --c-check:#f0a63f;
    --c-ship:#e5687f;
    --c-ops:#8b93a1;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--text);
    font:14px/1.45 ui-sans-serif,-apple-system,"Inter","Segoe UI",Roboto,sans-serif;
    overflow:hidden;
  }

  /* ---------- top bar ---------- */
  #bar{
    position:fixed;top:0;left:0;right:0;height:48px;z-index:30;
    display:flex;align-items:center;gap:10px;padding:0 14px;
    background:rgba(14,16,19,.85);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
    overscroll-behavior-x:contain;flex-wrap:nowrap;
  }
  #bar::-webkit-scrollbar{display:none}
  #bar .navlink,#bar h1,#bar .btn{flex:0 0 auto}
  #bar .navlink.hub{background:#243044;color:#cfe0ff}
  #bar h1{font-size:13px;font-weight:600;letter-spacing:.02em;margin:0 12px 0 0}
  #bar h1 span{color:var(--muted);font-weight:400}
  .btn{
    background:#1a1e24;border:1px solid var(--line);color:var(--text);
    padding:6px 10px;border-radius:7px;font-size:12px;cursor:pointer;
  }
  .btn:hover{background:#222732;border-color:#39414e}
  .btn.on{background:#243044;border-color:#3c5a86;color:#cfe0ff}
  .navlink{color:var(--muted);text-decoration:none;font-size:12.5px;padding:6px 10px;border-radius:7px}
  .navlink:hover{background:#1a1e24;color:var(--text)}
  .navlink.active{background:#243044;color:#cfe0ff}
  .spacer{flex:1}
  .hint{color:var(--muted);font-size:11.5px}

  /* ---------- canvas ---------- */
  #stage{position:fixed;inset:48px 0 0 0;overflow:hidden;cursor:grab;
    background-image:
      radial-gradient(circle at 1px 1px, var(--grid) 1px, transparent 0);
    background-size:26px 26px;
  }
  #stage.panning{cursor:grabbing}
  #world{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
  #edges{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}

  /* ---------- lanes ---------- */
  .lane{
    position:absolute;border:1px dashed #232830;border-radius:16px;
    background:rgba(255,255,255,.012);
  }
  .lane b{
    position:absolute;top:-11px;left:18px;background:var(--bg);
    padding:0 8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);font-weight:600;
  }

  /* ---------- nodes ---------- */
  .node{
    position:absolute;border-radius:12px;padding:11px 13px 12px;
    background:var(--panel);border:1px solid var(--line);
    box-shadow:0 8px 22px rgba(0,0,0,.34);
    cursor:grab;user-select:none;
  }
  .node.dragging{cursor:grabbing;box-shadow:0 16px 40px rgba(0,0,0,.5);z-index:5}
  .node .tag{
    display:inline-block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
    color:#0e1013;background:var(--c-ops);padding:2px 6px;border-radius:5px;font-weight:700;
    margin-bottom:7px;
  }
  .node h3{margin:0 0 5px;font-size:13.5px;font-weight:650;line-height:1.25}
  .node p{margin:0;font-size:11.5px;color:var(--muted);line-height:1.45;white-space:pre-line}
  .node .meta{
    margin-top:8px;padding-top:7px;border-top:1px solid var(--line);
    font-size:10.5px;color:#6f7787;display:flex;justify-content:space-between;gap:8px;
  }
  .node[data-kind=know]{border-color:#33306a}
  .node[data-kind=plan]{border-color:#22405c}
  .node[data-kind=make]{border-color:#1e4a3a}
  .node[data-kind=check]{border-color:#4d3a1c}
  .node[data-kind=ship]{border-color:#4d2733}
  .node[data-kind=know] .tag{background:var(--c-know);color:#fff}
  .node[data-kind=plan] .tag{background:var(--c-plan)}
  .node[data-kind=make] .tag{background:var(--c-make)}
  .node[data-kind=check] .tag{background:var(--c-check)}
  .node[data-kind=ship] .tag{background:var(--c-ship);color:#fff}
  .node[contenteditable]{cursor:text}
  .node h3[contenteditable]:focus,.node p[contenteditable]:focus{outline:1px solid var(--accent);border-radius:4px}

  /* ---------- edges ---------- */
  .edge{fill:none;stroke:#39414e;stroke-width:1.6}
  .edge.loop{stroke:var(--c-check);stroke-dasharray:5 5}
  .edge.alt{stroke:#2f4a6b}
  .elabel{fill:#7d8595;font-size:10px;paint-order:stroke;stroke:var(--bg);stroke-width:4px}

  /* ---------- estimator ---------- */
  #est{
    position:fixed;top:60px;right:14px;width:340px;max-height:calc(100vh - 76px);
    overflow:auto;z-index:25;background:rgba(20,23,28,.96);border:1px solid var(--line);
    border-radius:14px;padding:14px;box-shadow:0 20px 50px rgba(0,0,0,.5);
  }
  #est.hidden{display:none}
  #est h2{margin:0 0 2px;font-size:13px}
  #est .sub{color:var(--muted);font-size:11px;margin-bottom:12px}
  .field{margin-bottom:10px}
  .field label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:4px}
  .field input[type=range]{width:100%}
  .seg{display:flex;gap:6px}
  .seg button{flex:1;font-size:11px;padding:6px 0}
  table{width:100%;border-collapse:collapse;margin-top:8px}
  td{padding:5px 0;font-size:11.5px;border-bottom:1px solid var(--line);vertical-align:top}
  td.r{text-align:right;color:var(--muted);white-space:nowrap}
  tr.total td{border-bottom:none;font-weight:700;color:#fff;padding-top:9px;font-size:12.5px}
  .note{margin-top:10px;font-size:10.5px;color:#6f7787;line-height:1.5}
  #mini{position:fixed;left:14px;bottom:14px;z-index:25;color:var(--muted);font-size:11px}

  /* mobile tab strip */
  .topnav{
    overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
    overscroll-behavior-x:contain;flex-wrap:nowrap;gap:4px;
  }
  .topnav::-webkit-scrollbar{display:none}
  .topnav a,.topnav .brand{
    flex:0 0 auto;min-height:44px;display:inline-flex;align-items:center;
  }
  .topnav .hub{
    color:#cfe0ff;background:#243044;border-radius:7px;font-weight:650;
  }

</style>
</head>
<body>

<div id="bar">
  <h1>Design System Kit</h1>
  <a class="navlink hub" href="../index.html">Hub</a>
  <a class="navlink active" href="design-system-agent-blueprint.html">Agent blueprint</a>
  <a class="navlink" href="design-system-checklist.html">Build checklist</a>
  <a class="navlink" href="design-system-components.html">Component gallery</a>
  <a class="navlink" href="design-system-motion.html">Motion lab</a>
  <a class="navlink" href="design-system-agent-ui.html">Agent UI</a>
  <a class="navlink" href="agent-ui-architecture.html">Architecture</a>
  <span style="width:8px"></span>
  <button class="btn" id="fit">Fit</button>
  <button class="btn" id="zin">+</button>
  <button class="btn" id="zout">−</button>
  <button class="btn" id="editBtn">Edit text</button>
  <button class="btn" id="addBtn">+ Node</button>
  <button class="btn" id="estBtn">Estimator</button>
  <button class="btn" id="save">Save layout</button>
  <button class="btn" id="reset">Reset</button>
  <div class="spacer"></div>
  <div class="hint">drag canvas to pan · scroll / ⌘+scroll to zoom · drag nodes to rearrange</div>
</div>

<div id="stage">
  <div id="world">
    <svg id="edges"></svg>
  </div>
</div>

<div id="mini"></div>

<div id="est">
  <h2>Build cost &amp; time</h2>
  <div class="sub">Adjust the sliders — everything recalculates live.</div>

  <div class="field">
    <label><span>Scope</span></label>
    <div class="seg">
      <button class="btn" data-scope="lean">Lean</button>
      <button class="btn on" data-scope="standard">Standard</button>
      <button class="btn" data-scope="enterprise">Enterprise</button>
    </div>
  </div>

  <div class="field">
    <label><span>Blended day rate</span><b id="rateOut"></b></label>
    <input type="range" id="rate" min="0" max="1200" step="25" value="400">
  </div>

  <div class="field">
    <label><span>People on it</span><b id="peopleOut"></b></label>
    <input type="range" id="people" min="1" max="4" step="1" value="1">
  </div>

  <div class="field">
    <label><span>Monthly model + infra spend</span><b id="opsOut"></b></label>
    <input type="range" id="ops" min="0" max="2000" step="50" value="300">
  </div>

  <table id="tbl"></table>
  <div class="note" id="note"></div>
</div>

<script>
/* ============================================================
   DATA — the blueprint
   ============================================================ */
const LANES = [
  {x:-40,  y:-40,  w:660,  h:940, label:"0 · Foundations"},
  {x:660,  y:-40,  w:660,  h:940, label:"1 · Taught knowledge"},
  {x:1360, y:-40,  w:700,  h:940, label:"2 · Plan & tokens"},
  {x:2100, y:-40,  w:700,  h:940, label:"3 · Generate in Figma"},
  {x:2840, y:-40,  w:700,  h:940, label:"4 · Self-correction loop"},
  {x:3580, y:-40,  w:680,  h:940, label:"5 · Ship & govern"},
];

// kind: know | plan | make | check | ship
const NODES = [
  /* ---- 0 Foundations ---- */
  {id:"n0", x:0,   y:30,  w:270, kind:"plan", tag:"Entry", t:"Brief intake",
   b:"Brand, product surface, platforms, scale (10 vs 300 components), existing Figma file or blank.\nOutput: structured brief JSON.", m:["Wk 1","Human 20 min"]},
  {id:"n1", x:0,   y:220, w:270, kind:"plan", tag:"Core", t:"Orchestrator agent",
   b:"Owns the plan graph. Decides which sub-agent runs, in what order, what can run in parallel. Holds budget + stop conditions.", m:["Wk 1–3","LLM + state machine"]},
  {id:"n2", x:310, y:220, w:270, kind:"plan", tag:"Core", t:"Shared memory / blackboard",
   b:"One JSON source of truth: brief, tokens, component specs, critique history, decisions log. Every agent reads & appends here.", m:["Wk 2","Postgres or file store"]},
  {id:"n3", x:0,   y:470, w:270, kind:"make", tag:"Tooling", t:"Figma MCP tool layer",
   b:"Typed tools: create_variables, create_component, set_variant, search_design_system, get_screenshot, code_connect.\nEvery write returns node IDs.", m:["Wk 2–4","Highest risk"]},
  {id:"n4", x:310, y:470, w:270, kind:"make", tag:"Tooling", t:"Idempotency + rollback",
   b:"Named-key upserts so re-runs don't duplicate. Snapshot page before each write batch; revert on failed critique.", m:["Wk 4","Non-negotiable"]},
  {id:"n5", x:0,   y:700, w:580, kind:"plan", tag:"Guardrail", t:"Budget & stop conditions",
   b:"Max loop iterations, max tokens, max Figma writes per run, human-approval gate before destructive edits. Prevents the classic runaway agent.", m:["Wk 3",""]},

  /* ---- 1 Knowledge ---- */
  {id:"k0", x:700, y:30,  w:280, kind:"know", tag:"Ingest", t:"Reference corpus",
   b:"The sites/systems you've taught it: Material, Polaris, Carbon, Primer, Spectrum, Atlassian + your own past systems and critiques.", m:["Wk 2","Curated, not scraped blindly"]},
  {id:"k1", x:1010,y:30,  w:280, kind:"know", tag:"Ingest", t:"Extraction pass",
   b:"For each reference: token scales, naming grammar, component anatomy, state matrix, a11y rules, doc structure. Stored as structured records, not prose blobs.", m:["Wk 2–3","One-time + refresh"]},
  {id:"k2", x:700, y:290, w:590, kind:"know", tag:"Core asset", t:"Design-system rubric",
   b:"The distilled scoring sheet — contrast, spacing rhythm, type scale ratio, token coverage %, naming consistency, variant completeness, state coverage, doc completeness. This is what makes self-correction real instead of vibes.", m:["Wk 3–4","Your moat"]},
  {id:"k3", x:700, y:520, w:280, kind:"know", tag:"Retrieval", t:"Vector + rule index",
   b:"Semantic search over patterns, plus hard rules that bypass the LLM entirely (WCAG ratios, 4/8px grid, min tap target).", m:["Wk 3",""]},
  {id:"k4", x:1010,y:520, w:280, kind:"know", tag:"Retrieval", t:"Precedent lookup",
   b:"\"How do 5 mature systems model a Button?\" returns anatomy + variant matrix + edge cases before generation starts.", m:["Wk 3",""]},
  {id:"k5", x:700, y:740, w:590, kind:"know", tag:"Learning", t:"Feedback → corpus",
   b:"Every human rejection and every failed critique becomes a new rubric row or a new precedent. The system gets sharper per project.", m:["Wk 9+","Compounding value"]},

  /* ---- 2 Plan & tokens ---- */
  {id:"p0", x:1400,y:30,  w:290, kind:"plan", tag:"Plan", t:"Scope planner",
   b:"Brief + precedent → component inventory, priority tiers (P0 primitives → P2 patterns), dependency order.", m:["Wk 4",""]},
  {id:"p1", x:1720,y:30,  w:290, kind:"plan", tag:"Plan", t:"Scale switch",
   b:"Small: ~12 components, 1 theme, flat tokens.\nEnterprise: 60–200 components, multi-brand, 3-tier tokens, density + theme modes.", m:["Wk 4","Same pipeline"]},
  {id:"p2", x:1400,y:290, w:290, kind:"make", tag:"Tokens", t:"Token synthesis agent",
   b:"Primitive → semantic → component tiers. Generates colour ramps, type scale, spacing, radius, elevation, motion.", m:["Wk 4–5",""]},
  {id:"p3", x:1720,y:290, w:290, kind:"check", tag:"Gate", t:"Token validator",
   b:"Deterministic code, no LLM: contrast pairs, ramp monotonicity, scale ratios, orphan/duplicate tokens, naming regex.", m:["Wk 5","Cheap, catches most bugs"]},
  {id:"p4", x:1400,y:530, w:610, kind:"make", tag:"Spec", t:"Component spec writer",
   b:"Per component: anatomy, props/variants, state matrix (default/hover/focus/active/disabled/loading/error), slots, a11y contract, do/don't. Spec is approved BEFORE any pixels are drawn — this is what keeps rework near zero.", m:["Wk 5–6",""]},
  {id:"p5", x:1400,y:750, w:610, kind:"plan", tag:"Gate", t:"Human checkpoint #1",
   b:"You review tokens + spec list in a diff view. 15–30 min. Approve, edit, or reject with a reason (the reason feeds the corpus).", m:["Per project",""]},

  /* ---- 3 Generate ---- */
  {id:"g0", x:2140,y:30,  w:290, kind:"make", tag:"Figma", t:"Variables writer",
   b:"Creates collections + modes (light/dark, density, brand) and binds every value. Nothing hardcoded.", m:["Wk 6",""]},
  {id:"g1", x:2460,y:30,  w:290, kind:"make", tag:"Figma", t:"Primitive builder",
   b:"Icon frames, surfaces, text styles, effect styles, base layout primitives.", m:["Wk 6",""]},
  {id:"g2", x:2140,y:270, w:290, kind:"make", tag:"Figma", t:"Component factory",
   b:"Builds component sets with proper variant properties, auto-layout, constraints, boolean/instance-swap props.", m:["Wk 6–8","Fiddliest part"]},
  {id:"g3", x:2460,y:270, w:290, kind:"make", tag:"Parallel", t:"Worker fan-out",
   b:"N component agents run concurrently, each owning its own page/section. Orchestrator merges. This is where \"very quickly\" actually comes from.", m:["Wk 8",""]},
  {id:"g4", x:2140,y:530, w:610, kind:"make", tag:"Figma", t:"Documentation agent",
   b:"Usage pages, anatomy callouts, do/don't boards, token tables — generated alongside, not after.", m:["Wk 8",""]},
  {id:"g5", x:2140,y:750, w:610, kind:"make", tag:"Figma", t:"Assembly & naming pass",
   b:"Page structure, layer naming grammar, publish-ready library organisation, description fields filled.", m:["Wk 8",""]},

  /* ---- 4 Self-correction ---- */
  {id:"c0", x:2880,y:30,  w:290, kind:"check", tag:"Observe", t:"Render & capture",
   b:"Screenshot every component set in every mode/state. The agent must SEE its output, not just its own JSON.", m:["Wk 8–9","Key insight"]},
  {id:"c1", x:3200,y:30,  w:290, kind:"check", tag:"Judge", t:"Deterministic checks",
   b:"Contrast, spacing off-grid, missing states, unbound values, naming violations, duplicate components. Fast + free.", m:["Wk 9",""]},
  {id:"c2", x:2880,y:290, w:290, kind:"check", tag:"Judge", t:"Vision critic",
   b:"Multimodal model scores screenshots against the rubric + nearest precedent. Returns issues with node IDs and severity.", m:["Wk 9–10",""]},
  {id:"c3", x:3200,y:290, w:290, kind:"check", tag:"Judge", t:"Consistency critic",
   b:"Cross-component: does Button focus ring match Input's? Same radius language? Same icon sizing? Catches drift no single-component check can.", m:["Wk 10",""]},
  {id:"c4", x:2880,y:530, w:610, kind:"check", tag:"Act", t:"Repair planner → patch",
   b:"Issues ranked by severity × cost. Emits minimal Figma patch ops, re-renders, re-scores. Loop exits when score ≥ threshold, no criticals, or iteration cap hit. Typically 2–4 passes.", m:["Wk 10–11","The self-correction"]},
  {id:"c5", x:2880,y:760, w:610, kind:"check", tag:"Safety", t:"Regression guard",
   b:"Score must never go down. Any patch that lowers the score is reverted from the snapshot. Stops the agent thrashing.", m:["Wk 11",""]},

  /* ---- 5 Ship ---- */
  {id:"s0", x:3620,y:30,  w:290, kind:"ship", tag:"Gate", t:"Human checkpoint #2",
   b:"Final review with the score report and a visual diff. Your rejections are logged with reasons.", m:["Per project",""]},
  {id:"s1", x:3940,y:30,  w:280, kind:"ship", tag:"Ship", t:"Publish library",
   b:"Version the Figma library, write release notes from the decisions log.", m:["Wk 11",""]},
  {id:"s2", x:3620,y:290, w:290, kind:"ship", tag:"Ship", t:"Code export",
   b:"Tokens → Style Dictionary / CSS vars / Tailwind theme. Optional component stubs.", m:["Wk 11–12",""]},
  {id:"s3", x:3940,y:290, w:280, kind:"ship", tag:"Ship", t:"Code Connect map",
   b:"Bind Figma components to real repo components so design↔code stays honest.", m:["Wk 12",""]},
  {id:"s4", x:3620,y:530, w:600, kind:"ship", tag:"Ops", t:"Drift watcher",
   b:"Scheduled re-scan: detached instances, off-token values, new rogue components. Opens a repair run automatically.", m:["Wk 12+",""]},
  {id:"s5", x:3620,y:750, w:600, kind:"ship", tag:"Ops", t:"Run report",
   b:"Time, cost, iterations, score delta, issues fixed, human minutes spent. Feeds your pricing and the corpus.", m:["Wk 12",""]},
];

const EDGES = [
  ["n0","n1"],["n1","n2"],["n1","n3"],["n3","n4"],["n1","n5"],
  ["k0","k1"],["k1","k2"],["k2","k3"],["k3","k4"],
  ["n1","p0",""],["k4","p0","precedent"],
  ["p0","p1"],["p1","p2"],["p2","p3"],["p3","p4"],["p4","p5"],
  ["p5","g0","approved"],
  ["g0","g1"],["g1","g2"],["g2","g3"],["g3","g4"],["g4","g5"],
  ["g5","c0"],["c0","c1"],["c1","c2"],["c2","c3"],["c3","c4"],["c4","c5"],
  ["c4","g2","patch loop",true],
  ["c5","s0"],["s0","s1"],["s1","s2"],["s2","s3"],["s3","s4"],["s4","s5"],
  ["s5","k5","learn",true],["s0","k5","rejections",true],["k5","k2","update rubric",true],
  ["n2","p2","",false,true],["k2","c2","rubric",false,true],["k2","p4","",false,true],
];

/* ============================================================
   RENDER
   ============================================================ */
const world = document.getElementById('world');
const svg   = document.getElementById('edges');
const stage = document.getElementById('stage');
const SKEY  = 'ds-agent-blueprint-v1';

let pos = {};
try { pos = JSON.parse(localStorage.getItem(SKEY) || '{}'); } catch(e){ pos = {}; }

LANES.forEach(L=>{
  const d=document.createElement('div');
  d.className='lane';
  d.style.cssText=`left:${L.x}px;top:${L.y}px;width:${L.w}px;height:${L.h}px`;
  d.innerHTML=`<b>${L.label}</b>`;
  world.appendChild(d);
});

const els = {};
NODES.forEach(n=>{
  const p = pos[n.id] || {x:n.x,y:n.y};
  const d=document.createElement('div');
  d.className='node'; d.dataset.id=n.id; d.dataset.kind=n.kind;
  d.style.cssText=`left:${p.x}px;top:${p.y}px;width:${n.w}px`;
  d.innerHTML =
    `<span class="tag">${n.tag}</span>`+
    `<h3>${n.t}</h3><p>${n.b}</p>`+
    (n.m ? `<div class="meta"><span>${n.m[0]||''}</span><span>${n.m[1]||''}</span></div>` : '');
  world.appendChild(d);
  els[n.id]=d;
});

function box(id){
  const e=els[id];
  return {x:parseFloat(e.style.left), y:parseFloat(e.style.top), w:e.offsetWidth, h:e.offsetHeight};
}

function drawEdges(){
  let out='';
  const marker = `<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#39414e"/></marker>
      <marker id="arl" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f0a63f"/></marker></defs>`;

  EDGES.forEach(([a,b,label,loop,alt])=>{
    if(!els[a]||!els[b]) return;
    const A=box(a), B=box(b);
    let x1,y1,x2,y2;
    const ac={x:A.x+A.w/2,y:A.y+A.h/2}, bc={x:B.x+B.w/2,y:B.y+B.h/2};
    const horizontal = Math.abs(bc.x-ac.x) > Math.abs(bc.y-ac.y);
    if(horizontal){
      const right = bc.x>ac.x;
      x1 = right ? A.x+A.w : A.x; y1 = A.y+A.h/2;
      x2 = right ? B.x : B.x+B.w; y2 = B.y+B.h/2;
    }else{
      const down = bc.y>ac.y;
      x1 = A.x+A.w/2; y1 = down ? A.y+A.h : A.y;
      x2 = B.x+B.w/2; y2 = down ? B.y : B.y+B.h;
    }
    const dx = Math.max(30, Math.abs(x2-x1)*0.45);
    const dy = Math.max(24, Math.abs(y2-y1)*0.45);
    const c1 = horizontal ? `${x1+(x2>x1?dx:-dx)},${y1}` : `${x1},${y1+(y2>y1?dy:-dy)}`;
    const c2 = horizontal ? `${x2+(x2>x1?-dx:dx)},${y2}` : `${x2},${y2+(y2>y1?-dy:dy)}`;
    const cls = 'edge'+(loop?' loop':'')+(alt?' alt':'');
    out += `<path class="${cls}" d="M${x1},${y1} C${c1} ${c2} ${x2},${y2}" marker-end="url(#${loop?'arl':'ar'})"/>`;
    if(label){
      const mx=(x1+x2)/2, my=(y1+y2)/2 - 6;
      out += `<text class="elabel" x="${mx}" y="${my}" text-anchor="middle">${label}</text>`;
    }
  });
  svg.innerHTML = marker + out;
  const b = bounds();
  svg.setAttribute('width', b.x2+200);
  svg.setAttribute('height', b.y2+200);
}

function bounds(){
  let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;
  LANES.forEach(L=>{x1=Math.min(x1,L.x);y1=Math.min(y1,L.y);x2=Math.max(x2,L.x+L.w);y2=Math.max(y2,L.y+L.h)});
  Object.keys(els).forEach(id=>{const B=box(id);x1=Math.min(x1,B.x);y1=Math.min(y1,B.y);x2=Math.max(x2,B.x+B.w);y2=Math.max(y2,B.y+B.h)});
  return {x1,y1,x2,y2};
}

/* ---------- pan / zoom ---------- */
let view={x:60,y:40,k:0.62};
function apply(){
  world.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.k})`;
  document.getElementById('mini').textContent = Math.round(view.k*100)+'%';
}
function fit(){
  const b=bounds();
  const pad=60;
  const kx=(stage.clientWidth-pad*2)/(b.x2-b.x1);
  const ky=(stage.clientHeight-pad*2)/(b.y2-b.y1);
  view.k=Math.min(kx,ky,1);
  view.x=pad-b.x1*view.k; view.y=pad-b.y1*view.k;
  apply();
}

let panning=false,start=null;
stage.addEventListener('pointerdown',e=>{
  if(e.target.closest('.node')) return;
  panning=true;start={x:e.clientX-view.x,y:e.clientY-view.y};
  stage.classList.add('panning');stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove',e=>{
  if(!panning)return;
  view.x=e.clientX-start.x;view.y=e.clientY-start.y;apply();
});
stage.addEventListener('pointerup',e=>{panning=false;stage.classList.remove('panning')});
stage.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=stage.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  if(e.ctrlKey||e.metaKey||Math.abs(e.deltaY)>Math.abs(e.deltaX)*2){
    const f=Math.exp(-e.deltaY*0.0016);
    const k=Math.min(2.2,Math.max(0.12,view.k*f));
    view.x = mx-(mx-view.x)*(k/view.k);
    view.y = my-(my-view.y)*(k/view.k);
    view.k=k;
  }else{
    view.x-=e.deltaX; view.y-=e.deltaY;
  }
  apply();
},{passive:false});

/* ---------- node drag ---------- */
let drag=null;
world.addEventListener('pointerdown',e=>{
  const n=e.target.closest('.node'); if(!n) return;
  if(n.isContentEditable || e.target.isContentEditable) return;
  e.stopPropagation();
  drag={el:n, ox:e.clientX/view.k-parseFloat(n.style.left), oy:e.clientY/view.k-parseFloat(n.style.top)};
  n.classList.add('dragging'); n.setPointerCapture(e.pointerId);
});
world.addEventListener('pointermove',e=>{
  if(!drag)return;
  drag.el.style.left=(e.clientX/view.k-drag.ox)+'px';
  drag.el.style.top =(e.clientY/view.k-drag.oy)+'px';
  drawEdges();
});
world.addEventListener('pointerup',()=>{ if(drag){drag.el.classList.remove('dragging');drag=null;} });

/* ---------- toolbar ---------- */
document.getElementById('fit').onclick=fit;
document.getElementById('zin').onclick=()=>{view.k=Math.min(2.2,view.k*1.2);apply()};
document.getElementById('zout').onclick=()=>{view.k=Math.max(0.12,view.k/1.2);apply()};

let editing=false;
document.getElementById('editBtn').onclick=e=>{
  editing=!editing; e.target.classList.toggle('on',editing);
  document.querySelectorAll('.node h3,.node p').forEach(el=>{
    if(editing) el.setAttribute('contenteditable','true'); else el.removeAttribute('contenteditable');
  });
};

let added=0;
document.getElementById('addBtn').onclick=()=>{
  const id='x'+(++added);
  const d=document.createElement('div');
  d.className='node'; d.dataset.id=id; d.dataset.kind='plan';
  const cx=(-view.x+stage.clientWidth/2)/view.k-130;
  const cy=(-view.y+stage.clientHeight/2)/view.k-50;
  d.style.cssText=`left:${cx}px;top:${cy}px;width:260px`;
  d.innerHTML=`<span class="tag">New</span><h3 contenteditable="true">Title</h3><p contenteditable="true">Describe this step…</p>`;
  world.appendChild(d); els[id]=d; drawEdges();
};

document.getElementById('estBtn').onclick=e=>{
  const p=document.getElementById('est');
  p.classList.toggle('hidden'); e.target.classList.toggle('on',!p.classList.contains('hidden'));
};
document.getElementById('estBtn').classList.add('on');

document.getElementById('save').onclick=()=>{
  const o={};
  Object.keys(els).forEach(id=>{o[id]={x:parseFloat(els[id].style.left),y:parseFloat(els[id].style.top)}});
  localStorage.setItem(SKEY,JSON.stringify(o));
  const b=document.getElementById('save'); b.textContent='Saved'; setTimeout(()=>b.textContent='Save layout',1200);
};
document.getElementById('reset').onclick=()=>{localStorage.removeItem(SKEY);location.reload()};

/* ============================================================
   ESTIMATOR
   ============================================================ */
const WORK = [
  // [name, lean days, standard days, enterprise days]
  ["Foundations: orchestrator, memory, guardrails", 4, 8, 14],
  ["Figma tool layer + idempotency/rollback",       6, 12, 20],
  ["Knowledge corpus + extraction",                 3, 6, 12],
  ["Rubric (the scoring sheet)",                    2, 5, 10],
  ["Retrieval: vector + hard rules",                2, 4, 8],
  ["Planner + token synthesis",                     3, 6, 11],
  ["Deterministic validators",                      2, 4, 7],
  ["Component spec writer",                         2, 5, 9],
  ["Figma generation agents + parallel fan-out",    6, 13, 24],
  ["Docs generation",                               1, 3, 6],
  ["Render/capture + vision critic",                3, 7, 12],
  ["Repair loop + regression guard",                3, 7, 12],
  ["Export, Code Connect, drift watcher",           2, 6, 12],
  ["Eval harness + test projects",                  2, 6, 12],
  ["Hardening, retries, observability",             2, 6, 13],
];

const els$ = {
  rate:document.getElementById('rate'), people:document.getElementById('people'),
  ops:document.getElementById('ops'), tbl:document.getElementById('tbl'),
  note:document.getElementById('note'),
};
let scope='standard';
const idx = {lean:1, standard:2, enterprise:3};

function money(n){
  if(n>=1000) return '$'+(Math.round(n/100)/10).toFixed(1).replace(/\.0$/,'')+'k';
  return '$'+Math.round(n);
}
function render(){
  const rate=+els$.rate.value, people=+els$.people.value, ops=+els$.ops.value;
  document.getElementById('rateOut').textContent = rate===0?'$0 (you build it)':'$'+rate+'/day';
  document.getElementById('peopleOut').textContent = people+(people>1?' people':' person');
  document.getElementById('opsOut').textContent = '$'+ops+'/mo';

  const i=idx[scope];
  let days=0, rows='';
  WORK.forEach(w=>{
    days+=w[i];
    rows+=`<tr><td>${w[0]}</td><td class="r">${w[i]}d</td></tr>`;
  });
  // parallelism is imperfect
  const eff = people===1?1: (people===2?1.75: people===3?2.4:2.9);
  const cal = Math.ceil(days/eff);
  const weeks = Math.ceil(cal/5);
  const labour = days*rate;
  const months = Math.max(1, Math.round(weeks/4.33));
  const opsBuild = ops*months;
  const evalSpend = {lean:400, standard:1500, enterprise:5000}[scope];
  const total = labour+opsBuild+evalSpend;

  rows+=`<tr><td><b>Effort</b></td><td class="r">${days} person-days</td></tr>`;
  rows+=`<tr><td><b>Calendar</b> (${people}× at ${eff}× speedup)</td><td class="r">${cal} days ≈ ${weeks} wks</td></tr>`;
  rows+=`<tr><td>Labour</td><td class="r">${money(labour)}</td></tr>`;
  rows+=`<tr><td>Model + infra during build (${months} mo)</td><td class="r">${money(opsBuild)}</td></tr>`;
  rows+=`<tr><td>Eval / test-project token burn</td><td class="r">${money(evalSpend)}</td></tr>`;
  rows+=`<tr class="total"><td>Total to v1</td><td class="r">${money(total)}</td></tr>`;
  rows+=`<tr><td>Running cost after launch</td><td class="r">${money(ops)}/mo</td></tr>`;
  const perRun = {lean:[3,12], standard:[8,30], enterprise:[25,90]}[scope];
  rows+=`<tr><td>Cost per design-system run</td><td class="r">$${perRun[0]}–$${perRun[1]}</td></tr>`;
  const runTime = {lean:"20–45 min", standard:"1–3 hrs", enterprise:"4–10 hrs"}[scope];
  rows+=`<tr><td>Time per run (agent, unattended)</td><td class="r">${runTime}</td></tr>`;
  els$.tbl.innerHTML=rows;

  const notes = {
    lean:"Lean = one Figma file, ~12 components, single theme, one critic, manual triggering. Good proof of value, will not survive an enterprise brief.",
    standard:"Standard = 30–60 components, light/dark, 3-tier tokens, vision + consistency critics, repair loop, token export. This is the sweet spot.",
    enterprise:"Enterprise = multi-brand, density modes, 100+ components, Code Connect, drift watching, audit log, SSO/permissions. Most of the extra cost is reliability, not features."
  };
  els$.note.innerHTML = notes[scope] +
    "<br><br><b>Biggest risks to the estimate:</b> the Figma write layer (variants, auto-layout, variables via API/plugin are fiddly and undocumented at the edges) and critic calibration — budget 30–40% of total effort there. Set day rate to $0 to see pure token/infra cost if you build it yourself.";
}
els$.rate.oninput=els$.people.oninput=els$.ops.oninput=render;
document.querySelectorAll('[data-scope]').forEach(b=>{
  b.onclick=()=>{
    scope=b.dataset.scope;
    document.querySelectorAll('[data-scope]').forEach(x=>x.classList.toggle('on',x===b));
    render();
  };
});

/* ---------- boot ---------- */
drawEdges();
render();
apply();
window.addEventListener('resize',drawEdges);
setTimeout(fit,60);
</script>
