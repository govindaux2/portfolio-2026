<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Flow</title>
<style>
  :root {
    --bg: #0b0b0c;
    --surface: #141416;
    --line: #232326;
    --text: #f0f0ec;
    --muted: #96968f;
    --accent: #c6f24e;
    --radius: 14px;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.45 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
    touch-action: none;
  }
  canvas.drag { cursor: grabbing; }
  button, textarea, input { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; }
  .ui { transition: opacity .3s var(--ease); }
  body.hide .ui { opacity: 0; pointer-events: none; }

  #dock {
    position: fixed;
    top: 16px;
    left: 16px;
    width: 268px;
    z-index: 2;
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 18px 50px rgb(0 0 0 / .45);
    display: flex;
    flex-direction: column;
    max-height: calc(100dvh - 32px);
  }
  #dock header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 12px 10px;
    border-bottom: 1px solid var(--line);
    flex: 0 0 auto;
  }
  #dock header strong { font-size: 13px; font-weight: 600; letter-spacing: -.01em; }
  #dock header span { color: var(--muted); font-size: 12px; }
  #dock header .sp { flex: 1; }
  #dock header button {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    color: var(--muted);
  }
  #dock header button:hover { background: #1c1c1f; color: var(--text); }
  #body { padding: 12px; overflow-y: auto; flex: 1; }
  #dock.closed { width: auto; }
  #dock.closed #body { display: none; }

  .block { margin-bottom: 16px; }
  .block h3 {
    margin: 0 0 8px;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: .04em;
  }
  .slots {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .slot {
    position: relative;
    aspect-ratio: 1;
    border: 1px dashed #2e2e32;
    border-radius: 10px;
    background: #101012;
    overflow: hidden;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    color: var(--muted);
    font-size: 11px;
    text-align: center;
    padding: 8px;
  }
  .slot:hover, .slot.over { border-color: #4a4a40; background: #161618; }
  .slot.has { border-style: solid; border-color: var(--line); }
  .slot img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .slot.has span, .slot.has small { position: relative; z-index: 1; color: #fff; text-shadow: 0 1px 8px #000; }
  .slot small { font-size: 10px; opacity: .75; }
  .slot .x {
    position: absolute;
    top: 4px;
    right: 4px;
    z-index: 2;
    width: 20px;
    height: 20px;
    border-radius: 6px;
    background: rgb(11 11 12 / .7);
    color: #fff;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    line-height: 1;
  }
  .slot.has .x { display: flex; }
  .hint { margin: 8px 0 0; font-size: 11px; color: var(--muted); }

  textarea {
    width: 100%;
    min-height: 78px;
    resize: vertical;
    background: #101012;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 10px;
    color: var(--text);
    outline: none;
  }
  textarea:focus { border-color: #3a3a32; }
  textarea::placeholder { color: #6a6a64; }
  #read {
    min-height: 16px;
    margin: 6px 0 8px;
    font-size: 11px;
    color: var(--muted);
  }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chips button {
    padding: 5px 8px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: #101012;
    color: var(--muted);
    font-size: 11px;
  }
  .chips button:hover { color: var(--text); border-color: #3a3a32; }

  .seg {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 5px;
  }
  .seg button {
    padding: 8px 6px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: #101012;
    color: var(--muted);
  }
  .seg button:hover { color: var(--text); }
  .seg button.on {
    color: var(--bg);
    background: var(--accent);
    border-color: var(--accent);
    font-weight: 600;
  }

  .ctl { margin-bottom: 10px; }
  .ctl label {
    display: flex;
    justify-content: space-between;
    margin-bottom: 4px;
    font-size: 12px;
    color: #c8c8c0;
  }
  .ctl label i { font-style: normal; color: var(--muted); font-variant-numeric: tabular-nums; }
  input[type=range] {
    width: 100%;
    accent-color: var(--accent);
    margin: 0;
    height: 16px;
  }

  .row { display: flex; gap: 6px; }
  .row button {
    flex: 1;
    padding: 8px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: #101012;
    color: var(--text);
    font-size: 12px;
  }
  .row button:hover { background: #1a1a1d; }
  .row button:active { transform: scale(.98); }

  #bar {
    position: fixed;
    left: 16px;
    bottom: 16px;
    z-index: 2;
    color: var(--muted);
    font-size: 12px;
    background: color-mix(in srgb, var(--surface) 80%, transparent);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 7px 11px;
    backdrop-filter: blur(12px);
    pointer-events: none;
  }
  #err {
    display: none;
    position: fixed;
    left: 16px;
    right: 16px;
    bottom: 56px;
    z-index: 3;
    max-width: 640px;
    background: #2a1414;
    border: 1px solid #5a2a2a;
    color: #f0c8c8;
    border-radius: 10px;
    padding: 10px 12px;
    font: 11px/1.45 ui-monospace, Menlo, monospace;
    white-space: pre-wrap;
  }
  #err.show { display: block; }

  @media (max-width: 720px) {
    #dock {
      top: auto;
      bottom: 12px;
      left: 12px;
      right: 12px;
      width: auto;
      max-height: 46dvh;
    }
    #bar { display: none; }
  }
  @media (prefers-reduced-transparency: reduce) {
    #dock, #bar { backdrop-filter: none; background: var(--surface); }
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<aside id="dock" class="ui">
  <header>
    <strong>Flow</strong>
    <span>image + prompt</span>
    <span class="sp"></span>
    <button id="hide" title="Hide UI (H)">–</button>
  </header>
  <div id="body">
    <div class="block">
      <h3>References</h3>
      <div class="slots">
        <div class="slot" id="slot0" data-slot="0">
          <span>Look</span>
          <small>color</small>
          <button class="x" type="button" data-clear="0" aria-label="Clear look">×</button>
        </div>
        <div class="slot" id="slot1" data-slot="1">
          <span>Motion</span>
          <small>optional</small>
          <button class="x" type="button" data-clear="1" aria-label="Clear motion">×</button>
        </div>
      </div>
      <p class="hint">Drop, paste, or click. Look tints the field. Motion pushes it.</p>
      <input id="file" type="file" accept="image/*" hidden />
    </div>

    <div class="block">
      <h3>Prompt</h3>
      <textarea id="prompt" placeholder="slow silk current, close camera, warm"></textarea>
      <div id="read"></div>
      <div class="chips" id="chips"></div>
    </div>

    <div class="block">
      <h3>Look</h3>
      <div class="seg" id="modes">
        <button type="button" data-mode="0" class="on">Flow</button>
        <button type="button" data-mode="1">Volume</button>
        <button type="button" data-mode="2">Surface</button>
      </div>
    </div>

    <div class="block">
      <div class="ctl">
        <label>Speed <i id="speedV">0.70</i></label>
        <input id="speed" type="range" min="0" max="2" step="0.01" value="0.7" />
      </div>
      <div class="ctl">
        <label>Image mix <i id="mixV">0.55</i></label>
        <input id="mix" type="range" min="0" max="1" step="0.01" value="0.55" />
      </div>
    </div>

    <div class="row">
      <button type="button" id="reset">Reset view</button>
      <button type="button" id="frame">Save frame</button>
    </div>
  </div>
</aside>

<div id="bar" class="ui">Drag to orbit. Scroll to move in. H hides this.</div>
<div id="err"></div>

<script id="vert" type="x-shader/x-vertex">#version 300 es
layout(location=0) in vec2 aPos;
void main() {
  gl_Position = vec4(aPos, 0.0, 1.0);
}
</script>

<script id="frag" type="x-shader/x-fragment">#version 300 es
precision highp float;

uniform vec2 uRes;
uniform float uTime;
uniform vec3 uCam;
uniform vec2 uLook;
uniform float uSpeed;
uniform float uMix;
uniform float uMode;
uniform float uSeed;
uniform float uWarm;
uniform float uHas0;
uniform float uHas1;
uniform sampler2D uTex0;
uniform sampler2D uTex1;

out vec4 fragColor;

float hash(vec2 p) {
  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

float noise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(
    mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
    mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
    u.y
  );
}

float fbm(vec2 p) {
  float v = 0.0;
  float a = 0.5;
  for (int i = 0; i < 5; i++) {
    v += a * noise(p);
    p = p * 2.03 + vec2(1.7, 9.2);
    a *= 0.5;
  }
  return v;
}

float noise3(vec3 p) {
  return fbm(p.xy + p.z * 1.17);
}

float fbm3(vec3 p) {
  float v = 0.0;
  float a = 0.5;
  for (int i = 0; i < 4; i++) {
    v += a * noise3(p);
    p = p * 2.11 + 1.3;
    a *= 0.5;
  }
  return v;
}

vec3 accent() {
  vec3 acid = vec3(0.776, 0.949, 0.306);
  vec3 warm = vec3(0.92, 0.52, 0.22);
  vec3 cold = vec3(0.42, 0.68, 0.96);
  vec3 c = mix(acid, warm, clamp(uWarm, 0.0, 1.0));
  return mix(c, cold, clamp(-uWarm, 0.0, 1.0));
}

vec3 sampleLook(vec2 uv) {
  if (uHas0 < 0.5) return accent();
  return texture(uTex0, fract(uv)).rgb;
}

vec2 sampleMotion(vec2 uv) {
  if (uHas1 > 0.5) {
    vec3 m = texture(uTex1, fract(uv)).rgb;
    return (m.rg - 0.5) * 2.0;
  }
  if (uHas0 > 0.5) {
    float l0 = dot(texture(uTex0, fract(uv)).rgb, vec3(0.3, 0.59, 0.11));
    float lx = dot(texture(uTex0, fract(uv + vec2(0.01, 0.0))).rgb, vec3(0.3, 0.59, 0.11));
    float ly = dot(texture(uTex0, fract(uv + vec2(0.0, 0.01))).rgb, vec3(0.3, 0.59, 0.11));
    return vec2(lx - l0, ly - l0) * 8.0;
  }
  return vec2(0.0);
}

void camRay(vec2 p, out vec3 ro, out vec3 rd) {
  float yaw = uCam.x + uLook.x;
  float pitch = uCam.y + uLook.y;
  float dist = uCam.z;
  float cp = cos(pitch);
  ro = vec3(sin(yaw) * cp, sin(pitch), cos(yaw) * cp) * dist;
  vec3 ww = normalize(-ro);
  vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));
  vec3 vv = cross(uu, ww);
  rd = normalize(p.x * uu + p.y * vv + 1.55 * ww);
}

vec3 renderFlow(vec2 uv, vec2 p) {
  vec2 cam = vec2(uCam.x, uCam.y) + uLook;
  float z = (uCam.z - 2.4) * 0.12;
  float t = uTime * uSpeed * 0.12 + uSeed;
  vec3 acc = vec3(0.0);
  float wsum = 0.0;
  vec3 accCol = accent();

  for (int i = 0; i < 6; i++) {
    float fi = float(i);
    float par = (fi - 2.5);
    vec2 u = uv;
    u += cam * (0.08 + par * 0.035);
    u += vec2(z * par * 0.04, 0.0);
    u += 0.12 * vec2(fbm(u * 1.8 + t), fbm(u * 1.8 + 5.1 - t * 0.85));
    u += sampleMotion(u) * 0.07;
    float f = fbm(u * 2.6 + vec2(t * 0.6, -t * 0.4));
    float fil = smoothstep(0.44, 0.56, f) * smoothstep(0.68, 0.56, f);
    vec3 img = sampleLook(u * 0.9 + f * 0.04);
    vec3 base = vec3(0.055, 0.055, 0.06);
    vec3 layer = mix(base, mix(accCol, img, uMix), pow(f, 1.15));
    layer = mix(layer, img, fil * (0.35 + 0.65 * uMix));
    float w = exp(-fi * 0.18);
    acc += layer * w;
    wsum += w;
  }

  vec3 col = acc / wsum;
  float vig = smoothstep(1.45, 0.28, length(p));
  col *= vig;
  return col;
}

vec3 renderVolume(vec2 p) {
  vec3 ro, rd;
  camRay(p, ro, rd);
  float t = uTime * uSpeed * 0.08 + uSeed;
  vec3 acc = vec3(0.0);
  float trans = 1.0;
  float dist = 0.0;
  vec3 accCol = accent();

  for (int i = 0; i < 48; i++) {
    vec3 q = ro + rd * dist;
    vec3 wp = q;
    wp.xy += sampleMotion(q.xz * 0.25 + 0.5) * 0.35;
    float n = fbm3(wp * 1.15 + vec3(t, -t * 0.4, t * 0.2));
    float d = 1.0 - length(q * vec3(0.85, 1.05, 0.85)) * 0.42;
    float dens = max(n * d, 0.0);
    dens = smoothstep(0.18, 0.72, dens);

    vec3 img = sampleLook(q.xz * 0.22 + n * 0.08 + 0.5);
    vec3 albedo = mix(accCol * (0.35 + n), img, uMix);
    float stepLen = 0.085;
    float absorb = dens * stepLen * 2.4;
    acc += trans * albedo * absorb;
    trans *= exp(-absorb);
    dist += stepLen;
    if (trans < 0.02) break;
  }

  vec3 bg = vec3(0.043, 0.043, 0.047);
  vec3 col = mix(bg, acc, 1.0 - trans);
  col += accCol * (1.0 - trans) * 0.08;
  float vig = smoothstep(1.5, 0.3, length(p));
  return col * vig;
}

vec2 sphUV(vec3 p) {
  p = normalize(p);
  return vec2(
    0.5 + atan(p.z, p.x) / 6.2831853,
    0.5 - asin(clamp(p.y, -1.0, 1.0)) / 3.14159265
  );
}

float mapSurface(vec3 p) {
  vec2 uv = sphUV(p);
  float n = fbm3(p * 1.4 + uSeed);
  float h = n;
  if (uHas0 > 0.5) {
    float lum = dot(texture(uTex0, uv).rgb, vec3(0.3, 0.59, 0.11));
    h = mix(n, lum, uMix);
  }
  vec2 mot = sampleMotion(uv);
  h += (mot.x + mot.y) * 0.04;
  return length(p) - (1.05 + h * 0.28);
}

vec3 nrmSurface(vec3 p) {
  vec2 e = vec2(0.012, 0.0);
  return normalize(vec3(
    mapSurface(p + e.xyy) - mapSurface(p - e.xyy),
    mapSurface(p + e.yxy) - mapSurface(p - e.yxy),
    mapSurface(p + e.yyx) - mapSurface(p - e.yyx)
  ));
}

vec3 renderSurface(vec2 p) {
  vec3 ro, rd;
  camRay(p, ro, rd);
  float dist = 0.0;
  float hit = 0.0;
  vec3 pos = ro;

  for (int i = 0; i < 64; i++) {
    pos = ro + rd * dist;
    float d = mapSurface(pos);
    if (d < 0.004) { hit = 1.0; break; }
    if (dist > 12.0) break;
    dist += max(d, 0.012);
  }

  vec3 bg = vec3(0.043, 0.043, 0.047);
  bg += accent() * 0.03 * (0.6 + 0.4 * p.y);
  if (hit < 0.5) {
    float vig = smoothstep(1.5, 0.3, length(p));
    return bg * vig;
  }

  vec3 n = nrmSurface(pos);
  vec3 l = normalize(vec3(0.45, 0.8, 0.35));
  float diff = clamp(dot(n, l), 0.0, 1.0);
  float rim = pow(1.0 - clamp(dot(n, -rd), 0.0, 1.0), 2.2);
  vec3 img = sampleLook(sphUV(pos));
  vec3 accCol = accent();
  vec3 albedo = mix(mix(vec3(0.12), accCol, 0.45 + 0.2 * n.y), img, uMix);
  vec3 col = albedo * (0.18 + 0.82 * diff);
  col += accCol * rim * 0.35;
  col = mix(bg, col, 1.0);
  float vig = smoothstep(1.5, 0.3, length(p));
  return col * vig;
}

void main() {
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 p = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
  vec3 col;
  if (uMode < 0.5) col = renderFlow(uv, p);
  else if (uMode < 1.5) col = renderVolume(p);
  else col = renderSurface(p);

  float g = hash(gl_FragCoord.xy + floor(uTime * 12.0)) * 0.035;
  col += g;
  col = pow(max(col, 0.0), vec3(0.96));
  fragColor = vec4(col, 1.0);
}
</script>

<script>
(function () {
  const canvas = document.getElementById("c");
  const gl = canvas.getContext("webgl2", {
    antialias: false,
    alpha: false,
    preserveDrawingBuffer: true,
    powerPreference: "high-performance",
  });
  const errBox = document.getElementById("err");

  function fail(msg) {
    errBox.textContent = msg;
    errBox.classList.add("show");
    console.error(msg);
  }

  if (!gl) {
    fail("WebGL2 is not available in this browser.");
    return;
  }

  function compile(type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      fail(gl.getShaderInfoLog(sh) || "Shader compile failed");
      return null;
    }
    return sh;
  }

  const vs = compile(gl.VERTEX_SHADER, document.getElementById("vert").textContent);
  const fs = compile(gl.FRAGMENT_SHADER, document.getElementById("frag").textContent);
  if (!vs || !fs) return;

  const prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    fail(gl.getProgramInfoLog(prog) || "Program link failed");
    return;
  }
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  const U = {};
  [
    "uRes", "uTime", "uCam", "uLook", "uSpeed", "uMix", "uMode",
    "uSeed", "uWarm", "uHas0", "uHas1", "uTex0", "uTex1",
  ].forEach((name) => { U[name] = gl.getUniformLocation(prog, name); });

  function makeTex(r, g, b) {
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([r, g, b, 255]));
    return t;
  }

  const textures = [makeTex(40, 40, 44), makeTex(40, 40, 44)];
  const hasTex = [false, false];
  gl.uniform1i(U.uTex0, 0);
  gl.uniform1i(U.uTex1, 1);

  function loadImage(slot, src, name) {
    const img = new Image();
    img.onload = () => {
      gl.bindTexture(gl.TEXTURE_2D, textures[slot]);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, 1);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
      hasTex[slot] = true;
      const el = document.getElementById("slot" + slot);
      el.classList.add("has");
      let thumb = el.querySelector("img");
      if (!thumb) {
        thumb = document.createElement("img");
        thumb.alt = name || (slot ? "Motion reference" : "Look reference");
        el.prepend(thumb);
      }
      thumb.src = src;
      if (slot === 0 && Number(mixEl.value) < 0.6) {
        mixEl.value = "0.72";
        mixEl.dispatchEvent(new Event("input"));
      }
    };
    img.src = src;
  }

  function clearSlot(slot) {
    hasTex[slot] = false;
    const el = document.getElementById("slot" + slot);
    el.classList.remove("has");
    const thumb = el.querySelector("img");
    if (thumb) thumb.remove();
    gl.bindTexture(gl.TEXTURE_2D, textures[slot]);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([40, 40, 44, 255]));
  }

  const promptEl = document.getElementById("prompt");
  const readEl = document.getElementById("read");
  const speedEl = document.getElementById("speed");
  const mixEl = document.getElementById("mix");
  const speedV = document.getElementById("speedV");
  const mixV = document.getElementById("mixV");
  const modeBtns = [...document.querySelectorAll("#modes button")];

  const state = {
    mode: 0,
    speed: 0.7,
    mix: 0.55,
    warm: 0,
    seed: 0.17,
    time: 0,
    paused: false,
    cam: { yaw: 0.35, pitch: 0.18, dist: 2.55 },
    camT: { yaw: 0.35, pitch: 0.18, dist: 2.55 },
    look: { x: 0, y: 0 },
    lookT: { x: 0, y: 0 },
    dragging: false,
    last: null,
  };

  const STARTERS = [
    "slow silk current, close, warm",
    "wide volume fog, cold, slow",
    "metal surface, warm, close",
  ];
  const chips = document.getElementById("chips");
  STARTERS.forEach((text) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = text.split(",")[0];
    b.title = text;
    b.addEventListener("click", () => {
      promptEl.value = text;
      applyPrompt(text);
    });
    chips.appendChild(b);
  });

  function applyPrompt(text) {
    const t = (text || "").toLowerCase();
    const tags = [];
    let mode = null;
    let speed = null;
    let dist = null;
    let warm = 0;

    const modeRules = [
      [/\b(volume|fog|cloud|mist|vapor)\b/, 1, "volume"],
      [/\b(surface|terrain|relief|fabric|cloth|metal|grid)\b/, 2, "surface"],
      [/\b(flow|silk|liquid|ribbon|current|stream|smoke)\b/, 0, "flow"],
    ];
    for (const [re, id, label] of modeRules) {
      if (re.test(t)) { mode = id; tags.push(label); break; }
    }

    if (/\b(still|frozen)\b/.test(t)) { speed = 0.08; tags.push("still"); }
    else if (/\b(slow|gentle|drift)\b/.test(t)) { speed = 0.28; tags.push("slow"); }
    else if (/\b(fast|rush|rapid)\b/.test(t)) { speed = 1.55; tags.push("fast"); }

    if (/\b(close|near|macro)\b/.test(t)) { dist = 1.55; tags.push("close"); }
    else if (/\b(wide|far|aerial)\b/.test(t)) { dist = 4.4; tags.push("wide"); }

    if (/\b(warm|amber|gold|sunset)\b/.test(t)) { warm = 1; tags.push("warm"); }
    else if (/\b(cold|cool|ice|night|blue)\b/.test(t)) { warm = -1; tags.push("cold"); }
    else if (/\b(acid|lime)\b/.test(t)) { warm = 0; tags.push("acid"); }

    if (mode !== null) setMode(mode);
    if (speed !== null) {
      speedEl.value = String(speed);
      state.speed = speed;
      speedV.textContent = speed.toFixed(2);
    }
    if (dist !== null) state.camT.dist = dist;
    state.warm = warm;
    state.seed = 0.13 + (t.length % 17) * 0.041;

    readEl.textContent = tags.length ? "Using: " + tags.join(", ") : (t.trim() ? "Using as a seed only" : "");
  }

  function setMode(id) {
    state.mode = id;
    modeBtns.forEach((b) => b.classList.toggle("on", Number(b.dataset.mode) === id));
  }

  modeBtns.forEach((b) => b.addEventListener("click", () => setMode(Number(b.dataset.mode))));
  speedEl.addEventListener("input", () => {
    state.speed = Number(speedEl.value);
    speedV.textContent = state.speed.toFixed(2);
  });
  mixEl.addEventListener("input", () => {
    state.mix = Number(mixEl.value);
    mixV.textContent = state.mix.toFixed(2);
  });

  let promptTimer;
  promptEl.addEventListener("input", () => {
    clearTimeout(promptTimer);
    promptTimer = setTimeout(() => applyPrompt(promptEl.value), 220);
  });

  let fileTarget = 0;
  const fileEl = document.getElementById("file");
  document.querySelectorAll(".slot").forEach((slot) => {
    slot.addEventListener("click", (e) => {
      if (e.target.closest(".x")) return;
      fileTarget = Number(slot.dataset.slot);
      fileEl.click();
    });
    slot.addEventListener("dragover", (e) => { e.preventDefault(); slot.classList.add("over"); });
    slot.addEventListener("dragleave", () => slot.classList.remove("over"));
    slot.addEventListener("drop", (e) => {
      e.preventDefault();
      slot.classList.remove("over");
      const f = e.dataTransfer.files[0];
      if (f) readFile(Number(slot.dataset.slot), f);
    });
  });
  document.querySelectorAll("[data-clear]").forEach((btn) => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      clearSlot(Number(btn.dataset.clear));
    });
  });
  fileEl.addEventListener("change", () => {
    const f = fileEl.files && fileEl.files[0];
    if (f) readFile(fileTarget, f);
    fileEl.value = "";
  });

  function readFile(slot, file) {
    if (!file.type.startsWith("image/")) return;
    const src = URL.createObjectURL(file);
    loadImage(slot, src, file.name);
  }

  window.addEventListener("dragover", (e) => e.preventDefault());
  window.addEventListener("drop", (e) => {
    if (e.target.closest("#dock")) return;
    e.preventDefault();
    const f = e.dataTransfer.files[0];
    if (!f) return;
    const slot = hasTex[0] ? 1 : 0;
    readFile(slot, f);
  });
  window.addEventListener("paste", (e) => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (const item of items) {
      if (item.type.startsWith("image/")) {
        const slot = hasTex[0] ? 1 : 0;
        readFile(slot, item.getAsFile());
        break;
      }
    }
  });

  function pointerNdc(e) {
    const r = canvas.getBoundingClientRect();
    return {
      x: ((e.clientX - r.left) / r.width) * 2 - 1,
      y: ((e.clientY - r.top) / r.height) * 2 - 1,
    };
  }

  canvas.addEventListener("pointerdown", (e) => {
    canvas.setPointerCapture(e.pointerId);
    state.dragging = true;
    canvas.classList.add("drag");
    state.last = { x: e.clientX, y: e.clientY };
  });
  canvas.addEventListener("pointerup", (e) => {
    state.dragging = false;
    canvas.classList.remove("drag");
    try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
  });
  canvas.addEventListener("pointercancel", () => {
    state.dragging = false;
    canvas.classList.remove("drag");
  });
  canvas.addEventListener("pointermove", (e) => {
    const ndc = pointerNdc(e);
    if (!state.dragging) {
      state.lookT.x = ndc.x * 0.22;
      state.lookT.y = -ndc.y * 0.16;
      return;
    }
    const dx = e.clientX - state.last.x;
    const dy = e.clientY - state.last.y;
    state.last = { x: e.clientX, y: e.clientY };
    state.camT.yaw -= dx * 0.005;
    state.camT.pitch += dy * 0.004;
    state.camT.pitch = Math.max(-1.15, Math.min(1.15, state.camT.pitch));
    state.lookT.x = 0;
    state.lookT.y = 0;
  });
  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    state.camT.dist *= Math.exp(e.deltaY * 0.0011);
    state.camT.dist = Math.max(1.15, Math.min(7.5, state.camT.dist));
  }, { passive: false });

  document.getElementById("reset").addEventListener("click", () => {
    state.camT = { yaw: 0.35, pitch: 0.18, dist: 2.55 };
    state.lookT = { x: 0, y: 0 };
  });
  document.getElementById("frame").addEventListener("click", () => {
    const a = document.createElement("a");
    a.download = "flow-frame.png";
    a.href = canvas.toDataURL("image/png");
    a.click();
  });

  const dock = document.getElementById("dock");
  document.getElementById("hide").addEventListener("click", () => {
    dock.classList.toggle("closed");
  });
  window.addEventListener("keydown", (e) => {
    if (e.target === promptEl) return;
    if (e.key === "h" || e.key === "H") document.body.classList.toggle("hide");
    if (e.key === "r" || e.key === "R") document.getElementById("reset").click();
    if (e.key === " ") {
      e.preventDefault();
      state.paused = !state.paused;
    }
    if (e.key === "1") setMode(0);
    if (e.key === "2") setMode(1);
    if (e.key === "3") setMode(2);
  });

  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let lastTs = 0;

  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 1.5);
    const w = Math.max(1, Math.floor(innerWidth * dpr));
    const h = Math.max(1, Math.floor(innerHeight * dpr));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
    }
  }

  function lerp(a, b, t) { return a + (b - a) * t; }

  function frame(ts) {
    requestAnimationFrame(frame);
    if (document.hidden) return;
    resize();
    const dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0.016;
    lastTs = ts;
    if (!state.paused && !reduce) state.time += dt;

    const k = 1 - Math.pow(0.001, dt);
    state.cam.yaw = lerp(state.cam.yaw, state.camT.yaw, k);
    state.cam.pitch = lerp(state.cam.pitch, state.camT.pitch, k);
    state.cam.dist = lerp(state.cam.dist, state.camT.dist, k);
    state.look.x = lerp(state.look.x, state.lookT.x, k);
    state.look.y = lerp(state.look.y, state.lookT.y, k);

    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(U.uRes, canvas.width, canvas.height);
    gl.uniform1f(U.uTime, state.time);
    gl.uniform3f(U.uCam, state.cam.yaw, state.cam.pitch, state.cam.dist);
    gl.uniform2f(U.uLook, state.look.x, state.look.y);
    gl.uniform1f(U.uSpeed, state.speed);
    gl.uniform1f(U.uMix, state.mix);
    gl.uniform1f(U.uMode, state.mode);
    gl.uniform1f(U.uSeed, state.seed);
    gl.uniform1f(U.uWarm, state.warm);
    gl.uniform1f(U.uHas0, hasTex[0] ? 1 : 0);
    gl.uniform1f(U.uHas1, hasTex[1] ? 1 : 0);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, textures[0]);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, textures[1]);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
