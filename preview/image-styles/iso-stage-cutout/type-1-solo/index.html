<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stage Cutout · Type 1 Solo</title>
  <link rel="stylesheet" href="../../artifact-chrome.css?v=dividers" />
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font)}
    .wrap{width:min(920px,calc(100% - 40px));margin:0 auto;padding:16px 0 80px}
    .kicker{color:var(--accent);font-size:13px;margin:0 0 8px}
    h1{font-size:clamp(26px,4vw,36px);letter-spacing:-.03em;margin:0}
    p{color:var(--muted);line-height:1.5;max-width:40rem}
    .howto{display:flex;gap:10px;align-items:flex-start;margin:14px 0 0;padding:0;font-size:13px;color:var(--muted);line-height:1.45;max-width:40rem}
    .howto .ico{flex:0 0 22px;width:22px;height:22px;margin-top:1px;color:var(--accent)}
    .howto strong{color:var(--text)}
    .stage{
      margin-top:0;min-height:520px;border:0;border-radius:0;background:#0a0c10;
      background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
      background-size:48px 48px;background-position:center;
      display:grid;place-items:center;padding:48px 24px;position:relative;
    }
    .stage-label{position:absolute;left:0;top:14px;margin:0;padding:0;font:500 12px/1.2 var(--font);color:#c5cad3}
    .stage .rules-ico{position:absolute;top:8px;right:0;z-index:3}
    .cutout{position:relative;display:block;width:min(720px,100%);border:0;padding:0;background:transparent;cursor:pointer;outline:none;transition:transform .35s ease}
    .cutout img{display:block;width:100%;height:auto;filter:brightness(.88) saturate(.9);transition:filter .35s ease}
    .cutout:hover,.cutout:focus-visible,.cutout.is-on{transform:scale(1.045) translateY(-8px);z-index:2}
    .cutout:hover img,.cutout:focus-visible img,.cutout.is-on img{filter:brightness(1.18) saturate(1.2) sepia(.3) hue-rotate(170deg)}
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="artifact-nav" aria-label="Artifact">
      <div class="nav-left">
        <a class="nav-ico" href="../../" aria-label="Home" title="Home" data-tip="Home">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        </a>
        <a class="nav-ico" href="../" aria-label="Back" title="Back" data-tip="Back">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 6 9 12l6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <div class="crumbs" aria-label="Breadcrumb">
          <a href="../../">Image styles</a>
          <span class="sep">/</span>
          <a href="../">Stage Cutout</a>
          <span class="sep">/</span>
          <span class="now">Solo</span>
        </div>
      </div>
      <div class="nav-right">
        <button type="button" class="rules-ico" data-open-rules
          data-rules-src="rules/prompts.json"
          data-rules-title="Type 1 · Solo" data-tip="Rules"
          aria-label="Rules" title="Rules">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 4h10a2 2 0 0 1 2 2v14l-3-2-3 2-3-2-3 2V6a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.7"/><path d="M9 9h6M9 13h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
      </div>
    </nav>

    <p class="kicker">Type · Solo</p>
    <h1>Type 1 · Solo</h1>
    <p>One complete room. <strong style="color:var(--text)">1 phase</strong>.</p>

    <div class="sections">
      <div class="section">
        <div class="card-head">
          <div class="step">Phase 1 of 1</div>
          <button type="button" class="rules-ico" data-open-rules
            data-rules-src="rules/prompts.json"
            data-rules-title="Solo · Phase 1" data-tip="Phase rules"
            data-phase-note="Live hover build. Tint cutout pixels only."
            aria-label="Phase rules" title="Rules">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 4h10a2 2 0 0 1 2 2v14l-3-2-3 2-3-2-3 2V6a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.7"/><path d="M9 9h6M9 13h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          </button>
        </div>
        <strong class="title">Live stage</strong>
        <div class="howto">
          <span class="ico" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 3v2M12 19v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M3 12h2M19 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="12" r="3.5" stroke="currentColor" stroke-width="1.6"/></svg>
          </span>
          <div><strong>Hover the cutout</strong> — pixels tint and lift. Stage stays put.</div>
        </div>
        <div class="hr"></div>
        <div class="stage">
          <p class="stage-label">Shared stage</p>
          <button type="button" class="rules-ico" data-open-rules
            data-rules-src="rules/prompts.json"
            data-rules-title="Solo · stage" data-tip="Stage rules"
            aria-label="Rules" title="Rules">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 4h10a2 2 0 0 1 2 2v14l-3-2-3 2-3-2-3 2V6a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.7"/><path d="M9 9h6M9 13h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          </button>
          <button class="cutout" type="button" aria-label="Solo cutout" data-cutout>
            <img src="assets/solo.png" width="1280" height="720" alt="Solo room cutout" />
          </button>
        </div>
      </div>
    </div>
  </div>
  <script src="../../artifact-chrome.js"></script>
  <script>
    (function () {
      var cut = document.querySelector('[data-cutout]');
      if (cut) cut.addEventListener('click', function () { cut.classList.toggle('is-on'); });
    })();
  </script>
</body>
</html>
