<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stage Cutout · types</title>
  <link rel="stylesheet" href="../artifact-chrome.css?v=dividers" />
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font)}
    .wrap{width:min(960px,calc(100% - 40px));margin:0 auto;padding:16px 0 80px}
    .kicker{color:var(--accent);font-size:13px;margin:0 0 8px}
    h1{font-size:clamp(28px,4vw,40px);letter-spacing:-.03em;margin:0}
    p{color:var(--muted);line-height:1.5;max-width:42rem}
    .list-row{position:relative}
    .list-row .rules-ico{position:absolute;top:20px;right:0;z-index:2}
    .list-row .body .tag{display:flex;justify-content:space-between;gap:8px;padding-right:32px}
    .list-row .phases{color:var(--muted);font-variant-numeric:tabular-nums}
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="artifact-nav" aria-label="Artifact">
      <div class="nav-left">
        <a class="nav-ico" href="../" aria-label="Home" title="Home" data-tip="Home">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        </a>
        <a class="nav-ico" href="../" aria-label="Back" title="Back" data-tip="Back">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 6 9 12l6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <div class="crumbs" aria-label="Breadcrumb">
          <a href="../">Image styles</a>
          <span class="sep">/</span>
          <span class="now">Stage Cutout</span>
        </div>
      </div>
    </nav>

    <p class="kicker">Image style</p>
    <h1>Stage Cutout</h1>
    <p>Types first. Phases live inside each type.</p>

    <div class="sections">
      <div class="list-row">
        <a class="thumb" href="type-1-solo/" aria-label="Type 1 Solo">
          <img src="type-1-solo/assets/solo-thumb.png" width="640" height="480" alt="Type 1 Solo" />
        </a>
        <div class="body">
          <button type="button" class="rules-ico" data-open-rules
            data-rules-src="type-1-solo/rules/prompts.json"
            data-rules-title="Type 1 · Solo" data-tip="Solo rules"
            aria-label="Solo rules" title="Rules">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 4h10a2 2 0 0 1 2 2v14l-3-2-3 2-3-2-3 2V6a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.7"/><path d="M9 9h6M9 13h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          </button>
          <p class="tag"><span>Type 1</span><span class="phases">1 phase</span></p>
          <strong><a class="text-link" href="type-1-solo/">Solo</a></strong>
          <span class="desc">One complete room · live hover.</span>
        </div>
      </div>

      <div class="list-row">
        <a class="thumb" href="type-2-stack/" aria-label="Type 2 Stack">
          <img src="type-2-stack/assets/type-thumb.jpg" width="864" height="648" alt="Type 2 Stack" />
        </a>
        <div class="body">
          <button type="button" class="rules-ico" data-open-rules
            data-rules-src="type-2-stack/rules/prompts.json"
            data-rules-title="Type 2 · Stack" data-tip="Stack rules"
            aria-label="Stack rules" title="Rules">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 4h10a2 2 0 0 1 2 2v14l-3-2-3 2-3-2-3 2V6a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.7"/><path d="M9 9h6M9 13h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          </button>
          <p class="tag"><span>Type 2</span><span class="phases">3 phases</span></p>
          <strong><a class="text-link" href="type-2-stack/">Stack</a></strong>
          <span class="desc">Floorplan puzzle · rooms beside each other.</span>
        </div>
      </div>
    </div>
  </div>
  <script src="../artifact-chrome.js"></script>
</body>
</html>
