<title>MIP explore · icons · blue-yellow</title>
<link rel="stylesheet" href="../surface.css"/>
<style>
:root{
  --font: "IBM Plex Sans", "IBM Plex Sans Condensed", Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif;
  --bg0:#edf1f6; --bg1:#f7f9fc; --paper:#ffffff; --paper-88:rgba(255,255,255,.88); --paper-72:rgba(255,255,255,.72);
  --ink:#0f1011; --muted:#4B5563; --soft:#9ca7b5; --line:#DDE3EC; --line2:#EEF2F6;
  --steel:#2e3944; --tool:#4d5c6a; --alloy:#576069; --carbon:#0f1011;
  --red:#FFC43D; --orange:#FFD66B; --smelter:#274B83; --rose:#fff0ee;
  --green:#14B8A6; --green2:#dbf2e7; --amber:#ffd596; --blue:#88a9d8; --violet:#b7a2ff;
  --r-btn:4px; --r-card:4px; --r-panel:4px; --r-lg:4px;
  --shadow-card:0 18px 48px rgba(38,49,63,.12), inset 0 1px 0 rgba(255,255,255,.86);
  --shadow-soft:0 10px 28px rgba(38,49,63,.10);
  --shadow-red:0 12px 28px rgba(255,196,61,.20);
  --glass:blur(22px) saturate(1.35);
  --ease:cubic-bezier(.2,.8,.2,1); --dur:260ms;
}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:var(--font,"IBM Plex Sans",Inter,ui-sans-serif,system-ui,sans-serif);color:var(--ink,#111);background:transparent}
body{padding:12px}
.explore{display:grid;gap:12px}
.explore-note{margin:0;font:400 11px/1.4 var(--font);color:var(--muted,#657180)}


.icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.icon-cell{
  display:grid;gap:8px;justify-items:center;padding:14px 8px;border-radius:4px;
  background:rgba(255,255,255,.62);border:1px solid rgba(220,227,236,.92);
}
.icon-cell svg.icon{width:28px;height:28px;stroke:var(--red);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.icon-cell span{font:500 11px/1.2 var(--font);color:var(--muted,#657180);text-align:center}

html[data-ds-surface="dark"] .icon-cell{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.1)}
html[data-ds-surface="dark"] .icon-cell span{color:#9aa5b2}
html[data-ds-surface="dark"] .icon-cell svg.icon{stroke:var(--red)}
</style>
<script src="../surface-boot.js"></script>
</head>
